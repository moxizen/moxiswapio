<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoxiSwap — Native Multi-Chain DEX & Testnet Bridge</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #07090e; background-image: radial-gradient(circle at 20% 20%, rgba(112, 0, 255, 0.2), transparent 40%), radial-gradient(circle at 80% 30%, rgba(0, 240, 255, 0.15), transparent 40%); color: #f3f4f6; min-height: 100vh; }
    nav { display: flex; justify-content: space-between; align-items: center; padding: 14px 5%; background: rgba(11, 14, 22, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255, 255, 255, 0.08); position: sticky; top: 0; z-index: 50; }
    .logo { font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; color: #00f0ff; }
    .logo span { color: #ffffff; }
    .wallet-btn { background: rgba(0, 240, 255, 0.12); border: 1px solid rgba(0, 240, 255, 0.4); color: #00f0ff; padding: 8px 16px; border-radius: 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .ticker-bar { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; padding: 12px 16px; background: rgba(255, 255, 255, 0.02); border-bottom: 1px solid rgba(255, 255, 255, 0.06); }
    .coin-tag { background: #121722; border: 1px solid rgba(255, 255, 255, 0.08); padding: 6px 12px; border-radius: 10px; font-size: 12.5px; display: flex; align-items: center; gap: 6px; }
    .up { color: #10b981; font-weight: 600; }
    .down { color: #ef4444; font-weight: 600; }
    .container { max-width: 490px; margin: 26px auto; padding: 0 15px; }
    .ad-slot { background: rgba(255, 255, 255, 0.02); border: 1px dashed rgba(255, 255, 255, 0.15); border-radius: 12px; padding: 12px; text-align: center; font-size: 12px; color: #9ca3af; margin-bottom: 18px; }
    .swap-card { background: #111622; border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 24px; padding: 20px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7); }
    .tabs { display: flex; background: #080b11; padding: 5px; border-radius: 14px; margin-bottom: 18px; border: 1px solid rgba(255, 255, 255, 0.06); }
    .tab-btn { flex: 1; padding: 11px; border: none; border-radius: 10px; background: transparent; color: #9ca3af; font-size: 13.5px; font-weight: 600; cursor: pointer; }
    .tab-btn.active { background: linear-gradient(135deg, #00d2ff, #7000ff); color: #ffffff; }
    .input-panel { background: #090c13; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; padding: 15px; margin-bottom: 8px; }
    .panel-header { display: flex; justify-content: space-between; font-size: 12px; color: #9ca3af; margin-bottom: 10px; }
    .panel-body { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .amt-field { background: transparent; border: none; color: #ffffff; font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700; width: 48%; outline: none; }
    .selectors { display: flex; gap: 6px; }
    select { background: #1a2130; color: #ffffff; border: 1px solid rgba(255, 255, 255, 0.12); padding: 8px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer; }
    .flip-btn { width: 36px; height: 36px; background: #1a2130; border: 3px solid #111622; border-radius: 12px; color: #00f0ff; font-size: 16px; display: flex; align-items: center; justify-content: center; margin: -16px auto; position: relative; z-index: 10; cursor: pointer; }
    .details-box { background: rgba(255, 255, 255, 0.03); border-radius: 12px; padding: 12px; margin: 14px 0; font-size: 12px; color: #9ca3af; }
    .detail-row { display: flex; justify-content: space-between; margin-bottom: 5px; }
    .swap-btn { width: 100%; padding: 15px; border: none; border-radius: 15px; background: linear-gradient(135deg, #00d2ff 0%, #7000ff 100%); color: #ffffff; font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 700; cursor: pointer; }
    .status-msg { margin-top: 10px; font-size: 12.5px; text-align: center; color: #00f0ff; min-height: 18px; }
    .faucet-row { display: none; gap: 8px; margin-top: 12px; }
    .faucet-row a { flex: 1; text-align: center; padding: 9px; background: #182030; border: 1px solid rgba(0, 240, 255, 0.25); border-radius: 10px; color: #00f0ff; text-decoration: none; font-size: 12px; font-weight: 600; }
    footer { text-align: center; font-size: 12px; color: #6b7280; margin: 25px 0; }
  </style>
</head>
<body>
  <nav>
    <div class="logo">⚡ Moxi<span>Swap</span></div>
    <button class="wallet-btn" id="connect-btn" onclick="connectWallet()">🔗 Connect Wallet</button>
  </nav>

  <div class="ticker-bar" id="ticker">
    <div class="coin-tag">Loading live market prices...</div>
  </div>

  <div class="container">
    <div class="ad-slot">Advertisement Space (A-Ads Crypto Banner)</div>

    <div class="swap-card">
      <div class="tabs">
        <button id="btn-main" class="tab-btn active" onclick="switchMode('mainnet')">🟢 Mainnet Swap</button>
        <button id="btn-test" class="tab-btn" onclick="switchMode('testnet')">🧪 Testnet Bridge</button>
      </div>

      <div class="input-panel">
        <div class="panel-header">
          <span>You Pay</span>
          <span id="bal-label">Balance: --</span>
        </div>
        <div class="panel-body">
          <input type="number" id="pay-amt" class="amt-field" value="0.01" min="0" step="any" oninput="getLiveQuote()">
          <div class="selectors">
            <select id="from-chain" onchange="handleChainChange()"></select>
            <select id="from-token"><option value="NATIVE">Native (ETH/BNB)</option></select>
          </div>
        </div>
      </div>

      <div class="flip-btn" onclick="flipChains()">⇅</div>

      <div class="input-panel">
        <div class="panel-header">
          <span>You Receive (Est.)</span>
          <span>Direct On-Chain</span>
        </div>
        <div class="panel-body">
          <input type="text" id="rec-amt" class="amt-field" value="0.00" readonly>
          <div class="selectors">
            <select id="to-chain" onchange="getLiveQuote()"></select>
            <select id="to-token"><option value="NATIVE">Native (ETH/BNB)</option></select>
          </div>
        </div>
      </div>

      <div class="details-box">
        <div class="detail-row">
          <span>Execution Mode</span>
          <span style="color:#10b981; font-weight:600;">In-App Wallet Pop-up</span>
        </div>
        <div class="detail-row">
          <span>Integrator ID</span>
          <span style="color:#00f0ff;">moxiswapio</span>
        </div>
      </div>

      <button class="swap-btn" id="main-cta" onclick="executeInAppTrade()">⚡ Swap / Bridge Directly</button>
      <div class="status-msg" id="status-msg"></div>

      <div class="faucet-row" id="faucet-links">
        <a href="https://google.com" target="_blank">💧 Sepolia Faucet</a>
        <a href="https://alchemy.com" target="_blank">💧 Base Sepolia Faucet</a>
      </div>
    </div>

    <footer>© 2026 MoxiSwap • Native Web3 DEX & Cross-Chain Bridge</footer>
  </div>
  <script>
    var mode = 'mainnet';
    var userAddress = null;
    var currentQuoteTx = null;

    var mainChains = [
      { id: 1, hex: '0x1', name: 'Ethereum' },
      { id: 56, hex: '0x38', name: 'BNB Chain' },
      { id: 137, hex: '0x89', name: 'Polygon' },
      { id: 42161, hex: '0xa4b1', name: 'Arbitrum' },
      { id: 8453, hex: '0x2105', name: 'Base' }
    ];

    var testChains = [
      { id: 11155111, hex: '0xaa36a7', name: 'Sepolia' },
      { id: 84532, hex: '0x14a34', name: 'Base Sepolia' },
      { id: 421614, hex: '0x66eee', name: 'Arb Sepolia' },
      { id: 11155420, hex: '0xaa37dc', name: 'OP Sepolia' }
    ];

    function setStatus(msg) {
      var el = document.getElementById('status-msg');
      if (el) el.innerText = msg;
    }

    async function connectWallet() {
      if (typeof window.ethereum === 'undefined') {
        alert('MetaMask পাওয়া যায়নি! পিসিতে MetaMask এক্সটেনশন অথবা মোবাইলে MetaMask/Trust Wallet অ্যাপের ভেতরের ব্রাউজার দিয়ে ওপেন করুন।');
        return;
      }
      try {
        setStatus('Connecting wallet...');
        var accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
        if (accounts && accounts.length > 0) {
          userAddress = accounts[0];
          document.getElementById('connect-btn').innerText = '🟢 ' + userAddress.slice(0, 6) + '...' + userAddress.slice(-4);
          updateBalance();
          getLiveQuote();
        }
      } catch (err) {
        setStatus('Connection cancelled');
      }
    }

    async function updateBalance() {
      if (!window.ethereum || !userAddress) return;
      try {
        var hexBal = await window.ethereum.request({ method: 'eth_getBalance', params: [userAddress, 'latest'] });
        var ethBal = parseInt(hexBal, 16) / 1e18;
        document.getElementById('bal-label').innerText = 'Bal: ' + ethBal.toFixed(4);
      } catch (e) {}
    }

    function switchMode(selected) {
      mode = selected;
      document.getElementById('btn-main').classList.toggle('active', mode === 'mainnet');
      document.getElementById('btn-test').classList.toggle('active', mode === 'testnet');
      var fc = document.getElementById('from-chain');
      var tc = document.getElementById('to-chain');
      var list = mode === 'mainnet' ? mainChains : testChains;
      fc.innerHTML = '';
      tc.innerHTML = '';
      for (var i = 0; i < list.length; i++) {
        var opt1 = document.createElement('option');
        opt1.value = list[i].id;
        opt1.setAttribute('data-hex', list[i].hex);
        opt1.text = list[i].name;
        fc.appendChild(opt1);

        var opt2 = document.createElement('option');
        opt2.value = list[i].id;
        opt2.text = list[i].name;
        if (i === 1) opt2.selected = true;
        tc.appendChild(opt2);
      }
      document.getElementById('faucet-links').style.display = mode === 'mainnet' ? 'none' : 'flex';
      handleChainChange();
    }
    async function handleChainChange() {
      var fc = document.getElementById('from-chain');
      if (!fc.options[fc.selectedIndex]) return;
      var hexChain = fc.options[fc.selectedIndex].getAttribute('data-hex');
      if (window.ethereum && userAddress) {
        try {
          await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: hexChain }] });
          updateBalance();
        } catch (err) {
          setStatus('Switch network in MetaMask to ' + fc.options[fc.selectedIndex].text);
        }
      }
      getLiveQuote();
    }

    function flipChains() {
      var fc = document.getElementById('from-chain');
      var tc = document.getElementById('to-chain');
      var tmp = fc.selectedIndex;
      fc.selectedIndex = tc.selectedIndex;
      tc.selectedIndex = tmp;
      handleChainChange();
    }

    async function getLiveQuote() {
      var amt = parseFloat(document.getElementById('pay-amt').value) || 0;
      var fromChain = document.getElementById('from-chain').value;
      var toChain = document.getElementById('to-chain').value;
      if (amt <= 0) { document.getElementById('rec-amt').value = '0.00'; return; }

      if (mode === 'testnet') {
        document.getElementById('rec-amt').value = (amt * 0.999).toFixed(4);
        setStatus('Testnet Bridge Ready (Sepolia -> Base/OP Sepolia)');
        return;
      }

      setStatus('Fetching live LI.FI route...');
      try {
        var weiAmt = BigInt(Math.floor(amt * 1e18)).toString();
        var fromAddr = userAddress || '0x0000000000000000000000000000000000000001';
        var url = 'https://li.quest' + fromChain + '&toChain=' + toChain + '&fromToken=0x0000000000000000000000000000000000000000&toToken=0x0000000000000000000000000000000000000000&fromAmount=' + weiAmt + '&fromAddress=' + fromAddr + '&integrator=moxiswapio';
        var res = await fetch(url);
        var data = await res.json();
        if (data.estimate && data.estimate.toAmount) {
          var outEth = Number(data.estimate.toAmount) / 1e18;
          document.getElementById('rec-amt').value = outEth.toFixed(5);
          currentQuoteTx = data.transactionRequest;
          setStatus('Route Ready via ' + (data.toolDetails ? data.toolDetails.name : 'LI.FI'));
        } else {
          document.getElementById('rec-amt').value = '0.00';
          setStatus('Select different chains or higher amount');
        }
      } catch (e) {
        setStatus('Ready to swap');
      }
    }

    async function executeInAppTrade() {
      if (!userAddress) { await connectWallet(); return; }
      var amt = parseFloat(document.getElementById('pay-amt').value) || 0;
      if (amt <= 0) { alert('Enter valid amount'); return; }
      var hexWei = '0x' + BigInt(Math.floor(amt * 1e18)).toString(16);

      if (mode === 'testnet') {
        var toChain = document.getElementById('to-chain').value;
        var bridges = { '84532': '0xfd0Bf71F60660E2f608ed56e1659C450eB113120', '11155420': '0xFBb0621E0B23b5478B630BD55a5f21f67730B0F1' };
        var target = bridges[toChain];
        if (!target) { setStatus('Select Sepolia -> Base Sepolia or OP Sepolia!'); return; }
        try {
          setStatus('Confirm Testnet Bridge in MetaMask...');
          var txHash = await window.ethereum.request({ method: 'eth_sendTransaction', params: [{ from: userAddress, to: target, value: hexWei }] });
          setStatus('Bridge Sent! Hash: ' + txHash.slice(0, 12) + '...');
        } catch (err) { setStatus('Cancelled or low Sepolia ETH.'); }
        return;
      }

      if (!currentQuoteTx) { await getLiveQuote(); if (!currentQuoteTx) return; }
      try {
        setStatus('Confirm Swap in MetaMask...');
        var swapHash = await window.ethereum.request({ method: 'eth_sendTransaction', params: [{ from: userAddress, to: currentQuoteTx.to, data: currentQuoteTx.data, value: currentQuoteTx.value }] });
        setStatus('Swap Sent! Hash: ' + swapHash.slice(0, 12) + '...');
      } catch (err) { setStatus('Swap rejected or low balance.'); }
    }

    async function loadLivePrices() {
      try {
        var res = await fetch('https://cryptocompare.com');
        var json = await res.json();
        var raw = json.RAW;
        var coins = ['BTC', 'ETH', 'SOL', 'BNB'];
        var html = '';
        for (var i = 0; i < coins.length; i++) {
          var s = coins[i];
          var p = raw[s].USD.PRICE;
          var chg = raw[s].USD.CHANGEPCT24HOUR.toFixed(2);
          html += '<div class="coin-tag"><b>' + s + '</b> $' + p.toLocaleString(undefined, {maximumFractionDigits: 2}) + ' <span class="' + (chg >= 0 ? 'up' : 'down') + '">' + (chg >= 0 ? '+' : '') + chg + '%</span></div>';
        }
        document.getElementById('ticker').innerHTML = html;
      } catch (e) {
        document.getElementById('ticker').innerHTML = '<div class="coin-tag">🟢 Multi-Chain Live Market</div>';
      }
    }

    switchMode('mainnet');
    loadLivePrices();
    setInterval(loadLivePrices, 10000);
  </script>
</body>
</html>
